<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Aly ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="timer-section">

            <p class="label">Together for</p>

            <div class="timer">

                <div class="time-box">
                    <span id="months">0</span>
                    <small>months</small>
                </div>

                <div class="time-box">
                    <span id="days">0</span>
                    <small>days</small>
                </div>

                <div class="time-box">
                    <span id="hours">0</span>
                    <small>hours</small>
                </div>

                <div class="time-box">
                    <span id="minutes">0</span>
                    <small>minutes</small>
                </div>

                <div class="time-box">
                    <span id="seconds">0</span>
                    <small>seconds</small>
                </div>

            </div>

        </section>


        <section class="heart-section">

            <div class="heart-wrap">

                <button id="heartButton" class="heart-button" aria-label="Send a heart">
                    ♥
                </button>

                <div id="heartParticles" class="heart-particles"></div>

            </div>

            <p class="heart-count">
                <span id="heartCount">0</span>
            </p>

            <p class="heart-label">
                hearts sent
            </p>

        </section>

        <section class="spotify-section">

            <p class="label">Aly's Music</p>

            <div id="spotifyCard" class="spotify-card">

                <img id="spotifyCover" class="spotify-cover" src="" alt="">

                <div class="spotify-info">

                    <p id="spotifyStatus" class="spotify-status">
                        Checking Spotify...
                    </p>

                    <h2 id="spotifyTitle" class="spotify-title">
                    </h2>

                    <p id="spotifyArtist" class="spotify-artist">
                    </p>
                </div>

            </div>

        </section>

        <section class="notes-section">

            <p class="label">Our little note wall</p>

            <form id="noteForm" class="note-form">

                <textarea id="noteText" class="note-text" placeholder="Leave a little note..." maxlength="200"
                    required></textarea>

                <div class="note-form-bottom">

                    <span id="noteCharacters" class="note-characters">
                        0 / 200
                    </span>

                    <button class="note-button" type="submit">
                        Leave note ♡
                    </button>

                </div>

            </form>

            <div id="notesList" class="notes-list">
                <p class="notes-loading">
                    Loading notes...
                </p>
            </div>

        </section>

    </main>

    <script type="module" src="script.js"></script>
</body>

</html>
